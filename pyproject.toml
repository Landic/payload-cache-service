[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "payload-cache-service"
version = "0.1.0"
description = "FastAPI service that caches string transformations and deduplicates generated payloads."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.128,<0.129",
    "httpx>=0.28,<0.29",
    "pydantic-settings>=2.14,<2.15",
    "sqlalchemy>=2.0.50,<2.1",
    "uvicorn[standard]>=0.39,<0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
]

[project.scripts]
cache-cli = "cli.main:main"

[tool.setuptools.packages.find]
include = ["app*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

target-version = "py313"
